spring.application.name=encurtador-url

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:encurtador_url}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

spring.cache.type=redis
spring.cache.redis.time-to-live=${REDIS_TTL:10m}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:5000}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000}
app.redis.monitor-interval=${REDIS_MONITOR_INTERVAL:5000}

logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis.cache=DEBUG